version : "3.8"

services :
  nginx :
    build : "./requirements/nginx/"
    ports :
      - "443:443"
    environment :
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks :
      - inception-network
    volumes :
      - wordpress:/var/www/html
    depends_on:
      - wordpress

  wordpress :
    build : "./requirements/wordpress/"
    environment :
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: secure_password
    networks :
      - inception-network
    volumes :
      - wordpress:/var/www/html
  mariadb :
    build : "./requirements/mariadb/"
    environment :
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    networks :
      - inception-network
    volumes :
      - mariadb:/var/lib/mysql

networks:
  inception-network:
    driver: bridge
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/mariadb

