# ──────────────────────────────
#           NETWORKS
# ──────────────────────────────
networks:
  inception-network:
    driver: bridge

# ──────────────────────────────
#           VOLUMES
# ──────────────────────────────
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_WORDPRESS_PATH}
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_MARIADB_PATH}
  static-website:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_STATIC_PATH}

# ──────────────────────────────
#           SECRETS
# ──────────────────────────────
secrets:
  wp_db_password:
    file: ../secrets/wordpress/db_password.txt
  wp_admin_password:
    file: ../secrets/wordpress/wp_admin_password.txt
  n8n_db_credentials:
    file: ../secrets/n8n/db_credentials.txt
  n8n_encryption_key:
    file: ../secrets/n8n/encryption_key.txt

# ──────────────────────────────
#           SERVICES
# ──────────────────────────────
services:

  # ───── NGINX (Reverse Proxy) ─────
  nginx:
    build: "./requirements/nginx/"
    restart: always
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_PORT: ${WP_PORT}
      ADMINER_PORT: ${ADMINER_PORT}
      N8N_PORT: ${N8N_PORT}
      STATIC_WEBSITE_PORT: ${STATIC_WEBSITE_PORT}
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception-network

  # ───── WORDPRESS ─────
  wordpress:
    build:
      context : "./requirements/wordpress/"
      args:
        WP_PORT: ${WP_PORT}
    restart: always
    secrets:
      - wp_db_password
      - wp_admin_password
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      WORDPRESS_DB_HOST: mariadb:${MARIADB_PORT}
      WORDPRESS_DB_NAME: ${WP_DATABASE}
      WORDPRESS_DB_USER: ${WP_USER}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_SUB_USER: ${WP_SUB_USER}
      WP_SUB_EMAIL: ${WP_SUB_EMAIL}
      WP_SUB_PASSWORD: ${WP_SUB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception-network

  # ───── MARIADB ─────
  mariadb:
    build:
      context: "./requirements/mariadb/"
      args:
        MARIADB_PORT: ${MARIADB_PORT}
    restart: always
    secrets:
      - wp_db_password
      - n8n_db_credentials
    environment:
      WP_DATABASE: ${WP_DATABASE}
      WP_USER: ${WP_USER}
      N8N_DB_NAME: ${N8N_DB_MYSQLDB_DATABASE}
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception-network

  # ───── REDIS ─────
  redis:
    build:
      context: "./requirements/bonus/redis/"
      args:
        REDIS_PORT: ${REDIS_PORT}
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception-network

  # ───── ADMINER (DB GUI) ─────
  adminer:
    build:
      context: "./requirements/bonus/adminer/"
      args:
       ADMINER_PORT: ${ADMINER_PORT}
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER}
    depends_on:
      - mariadb
    networks:
      - inception-network

  # ───── STATIC WEBSITE ─────
  static-website:
    build:
      context: "./requirements/bonus/static-website/"
      args:
        STATIC_WEBSITE_PORT: ${STATIC_WEBSITE_PORT}
    restart: always
    volumes:
      - static-website:/quickstart/
    depends_on:
      - nginx
    networks:
      - inception-network

  # ───── FTP ─────
  ftp:
    build: "./requirements/bonus/ftp/"
    restart: always
    volumes:
      - wordpress:/home/ftpuser/wordpress
    ports:
      - "${FTP_PORT}:${FTP_PORT}"
    networks:
      - inception-network

  # ───── N8N ─────
  n8n:
    build:
      context: "./requirements/bonus/n8n/"
      args:
        N8N_PORT: ${N8N_PORT}
    restart: always
    secrets:
      - n8n_db_credentials
      - n8n_encryption_key
    environment:
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PATH: ${N8N_PATH}
      N8N_USER_FOLDER: ${N8N_USER_FOLDER}
      DB_TYPE: ${N8N_DB_TYPE}
      DB_MYSQLDB_HOST: ${N8N_DB_MYSQLDB_HOST}
      DB_MYSQLDB_PORT: ${N8N_DB_MYSQLDB_PORT}
      DB_MYSQLDB_DATABASE: ${N8N_DB_MYSQLDB_DATABASE}
      DB_MYSQLDB_COLLATION: ${N8N_DB_MYSQLDB_COLLATION}
    depends_on:
      - mariadb
    networks:
      - inception-network
