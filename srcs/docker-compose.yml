  #     - wordpress:/wordpress
  # wordpress :
  #   build : "./requirements/wordpress/"
  #   environment :
  #     WORDPRESS_DB_HOST: mysql:3306
  #     WORDPRESS_DB_NAME: wordpress
  #     WORDPRESS_DB_USER: wordpress
  #     WORDPRESS_DB_PASSWORD: secure_password
  #   networks :
  #     - inception-network
  #   volumes :
  #     - wordpress:/wordpress

networks:
  inception-network:
    driver: bridge
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/wordpress
  DB:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/DB

