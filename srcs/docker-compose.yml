services :
  nginx :
    build : "./requirements/nginx/"
    restart: always
    ports :
      - "443:443"
    environment :
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks :
      - inception-network
    volumes :
      - wordpress:/var/www/html
    depends_on:
      - wordpress

  redis:
    build : "./requirements/bonus/redis/"
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception-network

  adminer:
    build : "./requirements/bonus/adminer/"
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception-network

  static-website:
    build : "./requirements/bonus/static-website/"
    restart: always
    volumes:
      - static-website:/quickstart/
    depends_on:
      - nginx
    networks:
      - inception-network

  n8n:
    build: "./requirements/bonus/n8n/"
    restart: always
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PATH: ${N8N_PATH}
      N8N_LOG_LEVEL: debug
      DB_TYPE: mariadb
      DB_MYSQLDB_HOST: mariadb
      DB_MYSQLDB_PORT: 3306
      DB_MYSQLDB_DATABASE: n8n
      DB_MYSQLDB_USER: n8n_user
      DB_MYSQLDB_PASSWORD: n8n_password
      DB_MYSQLDB_COLLATION: utf8mb4_general_ci
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_ENCRYPTION_KEY: fqwfqfqfqfqfqfq
      N8N_OWNER_EMAIL: admin@gmail.com
      N8N_OWNER_PASSWORD: Admin1234
      N8N_OWNER_FIRST_NAME: Admin
      N8N_OWNER_LAST_NAME: User
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_USER_FOLDER: /home/n8n/.n8n
      N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      N8N_DISABLE_SENTRY: "true"
    depends_on:
      - mariadb  # Make sure this matches your MariaDB service name
    networks:
      - inception-network
      - internet
    # volumes:
    #   - n8n:/n8n

  wordpress :
    build : "./requirements/wordpress/"
    secrets:
      - db_password
    restart: always
    environment :
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_SUB_USER: ${WP_SUB_USER}
      WP_SUB_EMAIL: ${WP_SUB_EMAIL}
      WP_SUB_PASSWORD: ${WP_SUB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks :
      - inception-network
    volumes :
      - wordpress:/var/www/html
    depends_on:
      - mariadb

  mariadb:
    build:
      context: "./requirements/mariadb/"
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception-network
    volumes:
      - mariadb:/var/lib/mysql

# Define secrets
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt


networks:
  inception-network:
    driver: bridge
  internet:
    driver: bridge
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/mariadb
  static-website:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rguigneb/data/static-website
