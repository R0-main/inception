# ──────────────────────────────
#           NETWORKS
# ──────────────────────────────
networks:
  inception-network:
    driver: bridge

# ──────────────────────────────
#           VOLUMES
# ──────────────────────────────
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_WORDPRESS_PATH}
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_MARIADB_PATH}

# ──────────────────────────────
#           SECRETS
# ──────────────────────────────
secrets:
  wp_db_password:
    file: ../secrets/wordpress/db_password.txt
  wp_admin_user_credentials:
    file: ../secrets/wordpress/wp_admin_user_credentials.txt
  wp_sub_user_credentials:
    file: ../secrets/wordpress/wp_sub_user_credentials.txt

# ──────────────────────────────
#           SERVICES
# ──────────────────────────────
services:

  # ───── NGINX (Reverse Proxy) ─────
  nginx:
    build:
      context: "./requirements/nginx/"
      args:
        NGINX_PORT: ${NGINX_PORT}
    restart: always
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_PORT: ${WP_PORT}
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception-network

  # ───── WORDPRESS ─────
  wordpress:
    build:
      context : "./requirements/wordpress/"
      args:
        WP_PORT: ${WP_PORT}
    restart: always
    secrets:
      - wp_db_password
      - wp_admin_user_credentials
      - wp_sub_user_credentials
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      WORDPRESS_DB_HOST: mariadb:${MARIADB_PORT}
      WORDPRESS_DB_NAME: ${WP_DATABASE}
      WORDPRESS_DB_USER: ${WP_USER}
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception-network

  # ───── MARIADB ─────
  mariadb:
    build:
      context: "./requirements/mariadb/"
      args:
        MARIADB_PORT: ${MARIADB_PORT}
    restart: always
    secrets:
      - wp_db_password
    environment:
      WP_DATABASE: ${WP_DATABASE}
      WP_USER: ${WP_USER}
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception-network
