[mysqld]
bind-address = 0.0.0.0
port = ${MARIADB_PORT}
max_connections = 100
innodb_buffer_pool_size = 128M
character-set-server = utf8mb4
collation-server = utf8mb4_general_ci
datadir=/var/lib/mysql
secure-file-priv=/var/lib/mysql
user=mysql

[mysql]
default-character-set = utf8mb4

[client]
default-character-set = utf8mb4
